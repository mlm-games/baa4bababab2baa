[package]
name = "baabaabaabaabababbababbaa"
version = "0.1.4"
edition = "2024"

[features]
default = []
linux = [
    "dep:nuxodecs",
    "nuxodecs/vaapi",
    "nuxodecs/h265",
    "nuxodecs/av1",
    "nuxodecs/gbm",
]
apple = ["dep:videotoolbox-rs"]

[dependencies]
thiserror = "2"
bytes = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nuxodecs = { version = "0.1", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
anodecs = { version = "0.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
    "sync",
    "rt-multi-thread",
    "macros",
    "time",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "VideoFrame",
    "VideoFrameBufferInit",
    "VideoPixelFormat",
] }
wasodecs = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
videotoolbox-rs = { version = "0.1", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
videotoolbox-rs = { version = "0.1", optional = true }

