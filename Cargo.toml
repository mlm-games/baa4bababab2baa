[package]
name = "baabaabaabaabababbababbaa"
version = "0.1.8"
edition = "2024"
description = "Cross-platform hardware-accelerated video/audio codecs (WebCodecs, MediaCodec, VAAPI, VideoToolbox)"
license = "MPL-2.0"
repository = "https://github.com/mlm-games/baa4bababab2baa"
keywords = ["codec", "video", "audio", "hardware", "webcodecs"]
categories = ["multimedia", "wasm", "api-bindings"]

[features]
default = []
linux = [
    "dep:nuxodecs",
    "nuxodecs/vaapi",
    "nuxodecs/h265",
    "nuxodecs/av1",
    "nuxodecs/gbm",
]
apple = ["dep:oxideav-videotoolbox", "dep:oxideav-core"]

[dependencies]
thiserror = "2"
bytes = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nuxodecs = { version = "0.1", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
anodecs = { version = "0.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = [
    "sync",
    "rt-multi-thread",
    "macros",
    "time",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "VideoFrame",
    "VideoFrameBufferInit",
    "VideoPixelFormat",
] }
wasodecs = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
oxideav-videotoolbox = { version = "0.0.3", optional = true }
oxideav-core = { version = "0.1", optional = true }

